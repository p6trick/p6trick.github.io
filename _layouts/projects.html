---
layout: default
---

<div class="l-wrap">
  {% for project in site.projects %}
    <article class="post">

      <h1><a href="{{ site.baseurl }}{{ project.url }}">{{ project.title }}</a></h1>

      <div class="entry">
        {{ project.excerpt }}
      </div>

      <a href="{{ site.baseurl }}{{ project.url }}">Read More</a>
    </article>
    <hr class="hr-separator">
  {% endfor %}
</div>
