---
layout: default
---

<div class="l-wrap">
  {% for post in site.posts %}
    {% if page.url contains '/projects/' %}
      <article class="post">

        <h1><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h1>

        <div class="entry">
          {{ post.excerpt }}
        </div>

        <a href="{{ site.baseurl }}{{ post.url }}">Read More</a>
      </article>
      <hr class="hr-separator">
    {% endif %}
  {% endfor %}
</div>

{% include footer.html %}
